%% ACL RAIN PoC — EMQX 5 file authorizer.
%%
%% Default-deny: authorization.no_match = deny di emqx.conf, dan baris terakhir
%% di file ini menolak sisanya secara eksplisit.
%%
%% Arah data hanya uplink. Tidak ada topic command/downlink di PoC ini.

%% ── ems-pv-01: TF6701 di CX5240. Publish saja, tidak boleh subscribe apa pun.
{allow, {user, "ems-pv-01"}, publish, ["rain/pts/+/+/telemetry",
                                       "rain/pts/+/+/status",
                                       "rain/pts/+/+/alarm"]}.
{deny,  {user, "ems-pv-01"}, subscribe, ["#"]}.
{deny,  {user, "ems-pv-01"}, publish, ["#"]}.

%% ── simulator-dev: stand-in CX5240 selama dev. Hak sama persis dengan ems-pv-01
%% supaya apa yang kita uji adalah hak akses yang nanti dipakai PLC.
{allow, {user, "simulator-dev"}, publish, ["rain/pts/+/+/telemetry",
                                           "rain/pts/+/+/status",
                                           "rain/pts/+/+/alarm"]}.
{deny,  {user, "simulator-dev"}, subscribe, ["#"]}.
{deny,  {user, "simulator-dev"}, publish, ["#"]}.

%% ── ingest: subscribe saja, tidak boleh publish.
%% Bentuk $share/... disebut eksplisit supaya shared subscription tetap lolos
%% pada versi EMQX yang mengecek filter sebelum prefix $share dilepas.
{allow, {user, "ingest"}, subscribe, ["rain/pts/#",
                                      "$share/ingest/rain/pts/#"]}.
{deny,  {user, "ingest"}, publish, ["#"]}.

%% ── Sisanya ditolak.
{deny, all}.
