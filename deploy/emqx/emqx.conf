## EMQX 5.8 — konfigurasi broker RAIN PoC.
##
## Prinsip: anonymous ditolak, default-deny di authorization, dan hanya listener
## TLS 8883 yang terbuka ke publik. Port 1883 dan dashboard 18083 dipublikasikan
## compose hanya ke 127.0.0.1 host, jadi aksesnya lewat SSH tunnel.

node {
  name   = "emqx@127.0.0.1"
  cookie = "${EMQX_NODE__COOKIE}"
  data_dir = "/opt/emqx/data"
}

log {
  console {
    enable = true
    level  = info
  }
}

## ── Listener ─────────────────────────────────────────────────────────────────

listeners.ssl.default {
  bind = "0.0.0.0:8883"
  max_connections = 1024
  ssl_options {
    cacertfile = "/opt/emqx/etc/certs/ca.crt"
    certfile   = "/opt/emqx/etc/certs/server.crt"
    keyfile    = "/opt/emqx/etc/certs/server.key"
    versions   = ["tlsv1.3", "tlsv1.2"]
    ## TBC: mutual TLS belum diputuskan. Kalau tim OT jadi memakai client
    ## certificate, ubah ke verify_peer + fail_if_no_peer_cert = true, lalu
    ## kirim client-ems-pv-01.crt/.key bersama ca.crt.
    verify = verify_none
    fail_if_no_peer_cert = false
  }
}

listeners.tcp.default {
  bind = "0.0.0.0:1883"
  max_connections = 64
}

## Tidak dipakai di PoC. Kalau outbound 8883 dari LAN EMS ternyata diblokir,
## fallback-nya MQTT over WebSocket 443 — aktifkan wss dan terbitkan portnya.
## TBC: menunggu konfirmasi firewall site dari tim OT.
listeners.ws.default  { enable = false }
listeners.wss.default { enable = false }

## ── Batas protokol ───────────────────────────────────────────────────────────

mqtt {
  max_packet_size   = 16KB
  max_topic_levels  = 8
  max_qos_allowed   = 1
  max_clientid_len  = 64
  ## Default EMQX 1.5 membuat deteksi LWT jatuh di 9-10 s dengan keepalive 5 s —
  ## terlalu mepet terhadap kriteria lulus < 10 s, dan terukur gagal separuh
  ## percobaan. 1.25 menurunkannya ke sekitar 7-8 s.
  ##
  ## Aman karena setiap PUBLISH juga menyegarkan timer keepalive, dan plant
  ## mengirim telemetry tiap 1 detik. Timer ini baru mendekati batas justru
  ## ketika lalu lintas benar-benar berhenti, yaitu kasus yang ingin kita
  ## deteksi cepat.
  keepalive_multiplier = 1.25
  ## Default 30 s menambahkan granularitas pengecekan di atas batas keepalive.
  ## 1 s membuat waktu deteksi dapat diprediksi. Biayanya timer per koneksi;
  ## di sini hanya ada satu client, jadi tidak berarti. Kalau nanti jumlah
  ## client bertambah banyak, naikkan lagi angka ini.
  keepalive_check_interval = 1s
  retain_available  = true
  ## Pesan antri untuk sesi yang sedang putus (ingest restart, clean_session=false).
  max_mqueue_len    = 100000
  mqueue_store_qos0 = false
}

## Rate limit per client. 34 device × 1 pesan/detik datang dari satu koneksi,
## jadi batas ini punya margin besar terhadap beban normal tetapi tetap
## membendung client yang mengamuk.
limiter {
  client {
    messages {
      rate     = "500/s"
      burst    = "1000/s"
    }
    bytes {
      rate     = "2MB/s"
      burst    = "4MB/s"
    }
  }
}

force_shutdown {
  enable = true
  max_mailbox_size = 10000
  max_heap_size = 64MB
}

## ── Autentikasi ──────────────────────────────────────────────────────────────
## Built-in database. User dibuat deploy/emqx/bootstrap.sh dari env — tidak ada
## password di repo. Anonymous ditolak karena tidak ada authenticator yang
## mengizinkannya dan listener tidak mengaktifkan enable_authn = false.

authentication = [
  {
    mechanism = password_based
    backend   = built_in_database
    user_id_type = username
    password_hash_algorithm {
      name = sha256
      salt_position = suffix
    }
  }
]

## ── Otorisasi ────────────────────────────────────────────────────────────────

authorization {
  no_match = deny
  deny_action = disconnect
  cache { enable = true }
  sources = [
    {
      type = file
      enable = true
      path = "/opt/emqx/etc/acl.conf"
    }
  ]
}

## ── Dashboard & REST API ─────────────────────────────────────────────────────

dashboard {
  listeners.http {
    bind = "0.0.0.0:18083"
  }
  default_username = "admin"
  default_password = "${EMQX_DASHBOARD__DEFAULT_PASSWORD}"
}
